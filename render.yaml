# ==============================================================================
# Render Infrastructure Blueprint Configuration (render.yaml)
# Unified FastAPI + React PWA Web Application Service
# ==============================================================================

services:
  - type: web
    name: saath-app
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && cd web && npm install && npm run build"
    startCommand: "PYTHONPATH=api python -m uvicorn saath.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: SAATH_DEMO
        value: "1"
      - key: SAATH_FORECASTER
        value: "heuristic"
      - key: SAATH_DB_PATH
        value: ":memory:"
      - key: SAATH_LLM_TIMEOUT_S
        value: "20.0"
      - key: PYTHONPATH
        value: "api"
